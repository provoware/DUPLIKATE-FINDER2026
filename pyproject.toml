[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provoware-duplicate-finder-2026"
version = "0.7.1"
description = "Lokales Linux-Werkzeug für Textsuche, sichere Duplikatprüfung und virtuelle Organisation."
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "tools*", "agents*", "docs*", "data*", "logs*", "recovery*", "quarantine*"]
