name: Entwicklungs-Vollpaket

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/automatische-entwicklungsabhaengigkeiten-*"
      - "feature/provoware-autonomie-standard-*"
    paths:
      - "app/**"
      - "tools/**"
      - "tests/**"
      - "pyproject.toml"
      - "dependencies.env"
      - "ENTWICKLUNG_STARTEN.sh"
      - ".github/workflows/development-full-bundle.yml"
      - "manifest/**"
      - "schemas/**"
      - "standards/**"

permissions:
  contents: read

concurrency:
  group: provoware-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vollpaket:
    name: Linux x86_64 Entwicklungs-Vollpaket
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Zentrale Versions- und Laufzeitvorgaben lesen
        run: |
          set -euo pipefail
          source dependencies.env
          VERSION="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          {
            echo "VERSION=$VERSION"
            echo "PACKAGE=PROVOWARE-DUPLIKATE-FINDER-2026-DEV-v${VERSION}-linux-x86_64"
            echo "PYTHON_ARCHIVE=$PYTHON_ARCHIVE"
            echo "PYTHON_URL=$PYTHON_URL"
            echo "PYTHON_SHA256=$PYTHON_SHA256"
            echo "PYSIDE6_VERSION=$PYSIDE6_VERSION"
            echo "PYTEST_SPEC=$PYTEST_SPEC"
            echo "SETUPTOOLS_SPEC=$SETUPTOOLS_SPEC"
            echo "WHEEL_SPEC=$WHEEL_SPEC"
          } >> "$GITHUB_ENV"
      - name: Qt-Grundlagen nur fuer den Pruefrechner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1
      - name: Bau-Cache wiederverwenden
        uses: actions/cache@v4
        with:
          path: |
            .build-cache/python
            .build-cache/wheels
          key: devbundle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'pyproject.toml') }}
      - name: Gepruefte Python-Laufzeit laden
        run: |
          mkdir -p .build-cache/python
          if [[ ! -f ".build-cache/python/$PYTHON_ARCHIVE" ]]; then
            curl --fail --location --retry 3 --output ".build-cache/python/$PYTHON_ARCHIVE" "$PYTHON_URL"
          fi
          cp ".build-cache/python/$PYTHON_ARCHIVE" "$PYTHON_ARCHIVE"
          echo "$PYTHON_SHA256  $PYTHON_ARCHIVE" | sha256sum --check --strict
      - name: Vollpaket aufbauen
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/out/$PACKAGE"
          mkdir -p "$P"
          tar --exclude=.git --exclude=out -cf - . | tar -xf - -C "$P"
          mkdir -p "$P/.provoware-dev"
          tar -xzf "$PYTHON_ARCHIVE" -C "$P/.provoware-dev"
          mv "$P/.provoware-dev/python" "$P/.provoware-dev/runtime"
          PY="$P/.provoware-dev/runtime/bin/python3"
          "$PY" -m ensurepip --upgrade || true
          mkdir -p "$P/.provoware-dev/wheelhouse" "$GITHUB_WORKSPACE/.build-cache/wheels"
          if ! compgen -G "$GITHUB_WORKSPACE/.build-cache/wheels/pyside6-$PYSIDE6_VERSION-*.whl" >/dev/null; then
            "$PY" -m pip download --disable-pip-version-check --only-binary=:all: --dest "$GITHUB_WORKSPACE/.build-cache/wheels" "PySide6==$PYSIDE6_VERSION" "$PYTEST_SPEC" "$SETUPTOOLS_SPEC" "$WHEEL_SPEC"
          fi
          cp -a "$GITHUB_WORKSPACE/.build-cache/wheels/." "$P/.provoware-dev/wheelhouse/"
          "$PY" -m pip install --disable-pip-version-check --no-index --find-links "$P/.provoware-dev/wheelhouse" "PySide6==$PYSIDE6_VERSION" "$PYTEST_SPEC" "$SETUPTOOLS_SPEC" "$WHEEL_SPEC"
          chmod +x "$P/ENTWICKLUNG_STARTEN.sh"
      - name: Vollpaket ohne Paket-Internet pruefen
        env:
          QT_QPA_PLATFORM: offscreen
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/out/$PACKAGE"
          "$P/ENTWICKLUNG_STARTEN.sh" --nur-pruefen
          "$P/ENTWICKLUNG_STARTEN.sh" --tests
      - name: Reproduzierbares Archiv und Pruefsumme
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cd out
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -cf - "$PACKAGE" | gzip -n > "$PACKAGE.tar.gz"
          sha256sum "$PACKAGE.tar.gz" > "$PACKAGE.tar.gz.sha256"
          sha256sum --check --strict "$PACKAGE.tar.gz.sha256"
      - name: Build-Nachweis und SPDX-Komponentenliste
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/out/$PACKAGE"
          PY="$P/.provoware-dev/runtime/bin/python3"
          "$PY" "$P/tools/build_metadata.py"             --archive "$GITHUB_WORKSPACE/out/$PACKAGE.tar.gz"             --output-dir "$P/reports"             --commit "$GITHUB_SHA"             --project-version "$VERSION"
      - name: Vollpaket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PROVOWARE-DUPLIKATE-FINDER-2026-DEV-v${{ env.VERSION }}-VOLLPAKET
          compression-level: 0
          path: |
            out/${{ env.PACKAGE }}.tar.gz
            out/${{ env.PACKAGE }}.tar.gz.sha256
            out/${{ env.PACKAGE }}/logs/ABHAENGIGKEITEN_AKTUELL.txt
            out/${{ env.PACKAGE }}/.provoware-dev/systemprofil.json
            out/${{ env.PACKAGE }}/reports/BUILD-NACHWEIS.json
            out/${{ env.PACKAGE }}/reports/SBOM.spdx.json
