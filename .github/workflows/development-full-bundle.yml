name: Entwicklungs-Vollpaket

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/automatische-entwicklungsabhaengigkeiten-*"
      - "feature/provoware-autonomie-standard-*"

permissions:
  contents: read

concurrency:
  group: provoware-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vollpaket:
    name: Linux x86_64 Entwicklungs-Vollpaket
    runs-on: ubuntu-24.04
    env:
      PACKAGE: PROVOWARE-DUPLIKATE-FINDER-2026-DEV-v0.2.1-linux-x86_64
      PYTHON_ARCHIVE: cpython-3.12.15+20261003-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
      PYTHON_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.12.15%2B20261003-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
      PYTHON_SHA256: 731af898886c5f821890dc901eca3c651cca8e51fa7308c159d12a1194aeac91
    steps:
      - uses: actions/checkout@v4
      - name: Qt-Grundlagen nur fuer den Pruefrechner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1
      - name: Bau-Cache wiederverwenden
        uses: actions/cache@v4
        with:
          path: |
            .build-cache/python
            .build-cache/wheels
          key: devbundle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'pyproject.toml') }}
      - name: Gepruefte Python-Laufzeit laden
        run: |
          mkdir -p .build-cache/python
          if [[ ! -f ".build-cache/python/$PYTHON_ARCHIVE" ]]; then
            curl --fail --location --retry 3 --output ".build-cache/python/$PYTHON_ARCHIVE" "$PYTHON_URL"
          fi
          cp ".build-cache/python/$PYTHON_ARCHIVE" "$PYTHON_ARCHIVE"
          echo "$PYTHON_SHA256  $PYTHON_ARCHIVE" | sha256sum --check --strict
      - name: Vollpaket aufbauen
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/out/$PACKAGE"
          mkdir -p "$P"
          tar --exclude=.git --exclude=out -cf - . | tar -xf - -C "$P"
          mkdir -p "$P/.provoware-dev"
          tar -xzf "$PYTHON_ARCHIVE" -C "$P/.provoware-dev"
          mv "$P/.provoware-dev/python" "$P/.provoware-dev/runtime"
          PY="$P/.provoware-dev/runtime/bin/python3"
          "$PY" -m ensurepip --upgrade || true
          mkdir -p "$P/.provoware-dev/wheelhouse" "$GITHUB_WORKSPACE/.build-cache/wheels"
          if ! compgen -G "$GITHUB_WORKSPACE/.build-cache/wheels/pyside6-6.11.2-*.whl" >/dev/null; then
            "$PY" -m pip download --disable-pip-version-check --only-binary=:all: --dest "$GITHUB_WORKSPACE/.build-cache/wheels" "PySide6==6.11.2" "pytest>=8,<9" "setuptools>=68" "wheel>=0.45"
          fi
          cp -a "$GITHUB_WORKSPACE/.build-cache/wheels/." "$P/.provoware-dev/wheelhouse/"
          "$PY" -m pip install --disable-pip-version-check --no-index --find-links "$P/.provoware-dev/wheelhouse" "PySide6==6.11.2" "pytest>=8,<9" "setuptools>=68" "wheel>=0.45"
          "$PY" -m pip install --disable-pip-version-check --no-index --find-links "$P/.provoware-dev/wheelhouse" --no-build-isolation --no-deps --editable "$P"
          chmod +x "$P/ENTWICKLUNG_STARTEN.sh"
      - name: Vollpaket ohne Paket-Internet pruefen
        env:
          QT_QPA_PLATFORM: offscreen
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/out/$PACKAGE"
          "$P/ENTWICKLUNG_STARTEN.sh" --nur-pruefen
          "$P/ENTWICKLUNG_STARTEN.sh" --tests
          "$P/ENTWICKLUNG_STARTEN.sh" --abnahme
      - name: Archiv und Pruefsumme
        run: |
          set -euo pipefail
          cd out
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
          sha256sum "$PACKAGE.tar.gz" > "$PACKAGE.tar.gz.sha256"
          sha256sum --check --strict "$PACKAGE.tar.gz.sha256"
      - name: Vollpaket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PROVOWARE-DUPLIKATE-FINDER-2026-DEV-v0.2.1-VOLLPAKET
          compression-level: 0
          path: |
            out/PROVOWARE-DUPLIKATE-FINDER-2026-DEV-v0.2.1-linux-x86_64.tar.gz
            out/PROVOWARE-DUPLIKATE-FINDER-2026-DEV-v0.2.1-linux-x86_64.tar.gz.sha256
            out/PROVOWARE-DUPLIKATE-FINDER-2026-DEV-v0.2.1-linux-x86_64/logs/ABHAENGIGKEITEN_AKTUELL.txt
            out/PROVOWARE-DUPLIKATE-FINDER-2026-DEV-v0.2.1-linux-x86_64/.provoware-dev/systemprofil.json
