name: Release-Promotion v0.7.0

on:
  push:
    branches: ["main"]
    paths:
      - "manifest/project.manifest.json"
      - "docs/RELEASE_NOTES_v0.7.0.md"
      - ".github/workflows/release-promote-v0.7.0.yml"

permissions:
  contents: write

concurrency:
  group: provoware-release-promotion-v0.7.0
  cancel-in-progress: false

jobs:
  promote:
    name: Geprüften main-Stand als v0.7.0 markieren
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release-Verträge prüfen
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          test "$VERSION" = "0.7.0"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("manifest/project.manifest.json").read_text(encoding="utf-8"))
          assert manifest["project"]["version"]=="0.7.0"
          frozen={area["id"]:area for area in manifest["governance"]["frozen_areas"]}
          assert frozen["ui_process_control"]["status"]=="FROZEN"
          assert frozen["robustness_scaling"]["status"]=="FROZEN"
          assert Path("docs/RELEASE_NOTES_v0.7.0.md").is_file()
          print("OK | v0.7.0 Release-Verträge erfüllt")
          PY

      - name: Tag v0.7.0 einmalig erzeugen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse --verify "refs/tags/v0.7.0" >/dev/null 2>&1; then
            echo "OK | Tag v0.7.0 existiert bereits"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v0.7.0" "$GITHUB_SHA" -m "PROVOWARE DUPLIKATE-FINDER 2026 v0.7.0"
          git push origin "refs/tags/v0.7.0"
          echo "OK | Tag v0.7.0 auf $GITHUB_SHA erstellt"
