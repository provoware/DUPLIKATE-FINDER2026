name: Qualität

on:
  push:
    branches: [main, "feature/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Kern- und Sicherheitstests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhängigkeiten installieren
        run: python -m pip install -e ".[test]"
      - name: Python kompilieren
        run: python -m compileall -q app tests tools
      - name: Tests ausführen
        run: python -m pytest

  sichtbarkeit:
    name: Oberfläche ${{ matrix.zoom }} Prozent
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        zoom: [100, 150, 200]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt-Laufzeit für den CI-Test bereitstellen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1
      - name: Abhängigkeiten installieren
        run: python -m pip install -e ".[test]"
      - name: Sichtbarkeit prüfen
        run: python tools/ui_scale_check.py --zoom ${{ matrix.zoom }} --output artifacts/ui-${{ matrix.zoom }}.png
      - name: Prüfbild sichern
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.zoom }}-prozent
          path: artifacts/ui-${{ matrix.zoom }}.png
