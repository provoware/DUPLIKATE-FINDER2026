name: Verbesserung
description: Kleine, klar abgegrenzte Verbesserung vorschlagen
title: "[Verbesserung] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Ziel
      description: Welches konkrete Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Sicherheitswirkung
      description: Kann die Änderung Originaldateien, Systempfade oder den Startmechanismus berühren?
    validations:
      required: true
